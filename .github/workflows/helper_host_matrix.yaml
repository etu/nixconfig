---
name: 'Workflow: Generate Host Matrix 🖥️'

'on':
  workflow_call:
    inputs:
      deployOnly:
        required: false
        type: boolean
        default: false
    outputs:
      matrix:
        description: "Matrix of hosts"
        value: ${{ jobs.generate.outputs.matrix }}

jobs:
  generate:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          nix-package-url: https://releases.nixos.org/nix/nix-2.31.3/nix-2.31.3-x86_64-linux.tar.xz

      - name: Generate matrix
        id: set
        run: |
          set -Eeuo pipefail

          # Get the hosts (deploy-rs nodes are all NixOS hosts)
          if [[ "${{ inputs.deployOnly }}" == "true" ]]; then
            nixos=$(nix eval .#deploy.nodes --apply 'builtins.attrNames' --json)
            darwin='[]'
          else
            nixos=$(nix eval .#nixosConfigurations --apply 'builtins.attrNames' --json)
            darwin=$(nix eval .#darwinConfigurations --apply 'builtins.attrNames' --json)
          fi

          # Create the matrix object, with the runner, nix system and flake
          # attribute to build for each host
          matrix=$(jq -nc --argjson nixos "$nixos" --argjson darwin "$darwin" '
            [$nixos[] | {
              hostname: .,
              runner: "ubuntu-24.04",
              system: "x86_64-linux",
              attr: "nixosConfigurations.\(.).config.system.build.toplevel"
            }] + [$darwin[] | {
              hostname: .,
              runner: "macos-latest",
              system: "aarch64-darwin",
              attr: "darwinConfigurations.\(.).system"
            }]')

          # Output
          echo "matrix={\"include\": $matrix}" >> "$GITHUB_OUTPUT"
